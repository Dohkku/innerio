name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + format check
        run: bun check

      - name: Typecheck (workspaces)
        run: |
          cd apps/triplit-server && bunx tsc --noEmit
          cd ../../packages/schema && bunx tsc --noEmit
          cd ../core && bunx tsc --noEmit
          cd ../crypto && bunx tsc --noEmit
          cd ../methodology && bunx tsc --noEmit
          cd ../../apps/web && bun run typecheck

      - name: Test (vitest across workspaces)
        run: |
          cd packages/core && bun run test
          cd ../crypto && bun run test
          cd ../methodology && bun run test
          cd ../../apps/web && bun run test

      - name: Build web
        run: cd apps/web && bun run build
